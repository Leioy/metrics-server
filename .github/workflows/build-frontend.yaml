name: Build Frontend

on:
  push:
    branches:
      - "**"
    paths:
      - modules/web/**
      - .github/workflows/build-frontend.yaml
      - .github/actions/npm-login/**
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') }}

env:
  EXTENSION_NAME: metrics-server
  FRONTEND_PATH: modules/web

  IMAGE_REGISTRY: docker.io
  HUB_IMAGE_REGISTRY: hub.kubesphere.com.cn
  IMAGE_NAMESPACE: kubesphere
  IMAGE_NAME: metrics-server-frontend

jobs:
  build-extension:
    runs-on: self-runner-extensions
    timeout-minutes: 30
    steps:
      - name: Set FRONTEND_EXTENSION_PATH
        run: echo "FRONTEND_EXTENSION_PATH=${{ env.FRONTEND_PATH }}/extensions/${{ env.EXTENSION_NAME }}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.FRONTEND_PATH }}/.nvmrc

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Login (Internal)
        uses: ./.github/actions/npm-login
        with:
          username: ${{ secrets.INTERNAL_NPM_USERNAME }}
          password: ${{ secrets.INTERNAL_NPM_PASSWORD }}
          registry: ${{ secrets.INTERNAL_NPM_REGISTRY }}

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --prefer-offline
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Build
        run: yarn run build:ext ${{ env.EXTENSION_NAME }}
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to KubeSphere Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HUB_IMAGE_REGISTRY }}
          username: ${{ secrets.HUB_KUBESPHERE_USERNAME }}
          password: ${{ secrets.HUB_KUBESPHERE_PASSWORD }}

      - name: Set image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail

          {
            printf 'tags<<EOF\n'
            for registry in "$IMAGE_REGISTRY" "$HUB_IMAGE_REGISTRY"; do
              printf '%s/%s/%s:%s\n' "$registry" "$IMAGE_NAMESPACE" "$IMAGE_NAME" "$GITHUB_REF_NAME"
            done
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.FRONTEND_EXTENSION_PATH }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          push: true

      - name: Report published images
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
        run: |
          set -euo pipefail

          printf '### Published images\n\n```text\n%s\n```\n' "$IMAGE_TAGS" \
            | tee -a "$GITHUB_STEP_SUMMARY"
